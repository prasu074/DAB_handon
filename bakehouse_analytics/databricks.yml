# This is a Databricks asset bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 4ec0c621-a694-4d2c-8668-d534577ca0ac

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-417b9f91-269e.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-417b9f91-269e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/prashant.badwe.work@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/prashant.badwe.work@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: bronze_prod
    permissions:
      - user_name: prashant.badwe.work@gmail.com
        level: CAN_MANAGE
